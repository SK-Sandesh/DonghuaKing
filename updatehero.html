<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Donghua Updates</title>
  <style>
    :root {
      --bg: #2f2f2f;
      --panel: #3f3f3f;
      --item: #6b6b6b;
      --accent: #0e78b8;
      --accent-dark: #0a4f6b;
      --black-pill: #070707;
      --glass-shadow: 0 4px 8px rgba(0, 0, 0, 0.6), inset 0 -4px 6px rgba(0, 0, 0, 0.45);
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: white;
      -webkit-font-smoothing: antialiased;
      padding: 28px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    /* header ribbon */
    .header-ribbon {
      width: 900px;
      height: 72px;
      background: linear-gradient(#0ea4e6, var(--accent));
      border-radius: 18px 18px 8px 8px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), inset 0 -6px rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
      border: 3px solid rgba(255, 255, 255, 0.05);
    }

    .header-ribbon::before {

      position: absolute;
      left: -30px;
      top: 0;
      bottom: 0;
      width: 30px;
      background: transparent;
      border-radius: 30px 0 0 30px;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    .header-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffc600;
      text-shadow: 3px 1px 3px rgb(92 0 0), 3px -1px 0px rgb(255 246 0);
    }

    .container {
      width: 900px
    }

    /* day pills */
    .days-row {
      display: flex;
      gap: 10px;
      margin: 8px 0 18px 0
    }

    .day-pill {
      background: transparent;
      color: rgba(255, 255, 255, 0.9);
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.03);
    }

    .day-pill.active {
      background: var(--black-pill);
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7), inset 0 -6px rgba(255, 255, 255, 0.02)
    }

    /* big rounded panel */
    .panel {
      background: linear-gradient(180deg, #3b3b3b, #383838);
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px
    }

    .series-box {
      flex: 1;
      background: linear-gradient(#39597478, #00000054);
      padding: 16px 18px;
      border-radius: 14px;
      box-shadow: var(--glass-shadow);
      position: relative
    }

    .series-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 2px 1px 0 rgb(5 2 1 / 56%);
    }

    .copy-btn {
      min-width: 120px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(var(--accent), var(--accent-dark));
      border: 3px solid rgba(0, 0, 0, 0.6);
      color: white;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6), inset 0 -3px rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      text-transform: lowercase;
    }

    /* subtle outline that matches your screenshot around button */
    .copy-btn:active {
      transform: translateY(1px)
    }

    /* placeholder empty area (the screenshot shows a large empty lower area) */
    .panel-empty {
      height: 80px
    }

    /* toast */
    .toast {
      position: fixed;
      right: 40px;
      bottom: 40px;
      background: #111;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(8px);
      transition: all .18s ease;
      pointer-events: none;
      color: #fff;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0)
    }

    /* responsive */
    @media (max-width:980px) {
      body {
        padding: 18px
      }

      .header-ribbon {
        width: 100%
      }

      .container {
        width: 100%
      }
    }
  </style>
</head>

<body>
  <div>
    <div class="header-ribbon">
      <div class="header-title">Daily Donghua Updates</div>
    </div>

    <div class="container">
      <!-- Days row: Monday to Sunday -->
      <div class="days-row" role="tablist" aria-label="Days of week">
        <div class="day-pill active" data-day="monday">MONDAY</div>
        <div class="day-pill" data-day="tuesday">TUESDAY</div>
        <div class="day-pill" data-day="wednesday">WEDNESDAY</div>
        <div class="day-pill" data-day="thursday">THURSDAY</div>
        <div class="day-pill" data-day="friday">FRIDAY</div>
        <div class="day-pill" data-day="saturday">SATURDAY</div>
        <div class="day-pill" data-day="sunday">SUNDAY</div>
      </div>

      <!-- main panel that shows series list for selected day -->
      <div class="panel" id="panel">
        <!-- day title (big black pill like in screenshot) -->
        <div style="margin-bottom:18px">
          <div class="day-pill active" style="padding:14px 24px; font-size:22px">MONDAY</div>
        </div>

        <!-- series list -->
        <div id="series-list">
          <!-- each .list-item contains left title box and right copy button -->
        </div>

        <div class="panel-empty"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied!</div>

  <script>
    // Sample data: you will replace URLs/titles with your own.
    const data = {
      monday: [
        { title: 'Eclipse of illusion', url: 'https://pan.quark.cn/s/f2b89e0a1669#/list/share' },
        { title: 'Swallowed Star - Episode 2', url: 'https://example.com/swallowed-star-ep2' },
        { title: 'Other Series 1', url: 'https://example.com/other-1' },
        { title: 'Other Series 2', url: 'https://example.com/other-2' },
        { title: 'Other Series 3', url: 'https://example.com/other-3' },
        { title: 'Other Series 4', url: 'https://example.com/other-4' },
        { title: 'Other Series 5', url: 'https://example.com/other-5' }
      ],
      tuesday: [
        { title: 'Tuesday Show 1', url: '#' }, { title: 'Tuesday Show 2', url: '#' }
      ],
      wednesday: [
        // { title: '', url: '' },
        // { title: '', url: '' },
        // { title: '', url: '' },
        // { title: '', url: '' },
        // { title: '', url: '' },
        // { title: '', url: '' },
        // { title: '', url: '' }
      ], thursday: [], friday: [], saturday: [], sunday: [
        { title: 'Eclipse of illusion', url: 'https://pan.quark.cn/s/f2b89e0a1669#/list/share' },
        { title: 'Legend Of Xianwu', url: 'https://pan.quark.cn/s/90bc6c7a7d44#/list/share' },
        { title: 'Nine Yang martial God', url: 'https://pan.quark.cn/s/6f1a38ad850f#/list/share' },
        { title: 'Supreme Over The Sky', url: 'https://pan.quark.cn/s/f487d5a96ff8#/list/share' },
        { title: 'Eternal Sword Emperor', url: 'https://pan.quark.cn/s/e9bc67ae1660#/list/share' },
        { title: 'Peerless God Emperor', url: 'https://pan.quark.cn/s/4463e0d61eeb#/list/share' },
        { title: 'A record Of Mortal Journey To immortality', url: 'https://pan.quark.cn/s/ceff8d5a0ffc#/list/share' }
      ]
    };

    const days = document.querySelectorAll('.days-row .day-pill');
    const seriesList = document.getElementById('series-list');
    const panelDayTitle = document.querySelector('.panel .day-pill');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function renderDay(day) {
      // update active day pill in top row
      days.forEach(d => d.classList.toggle('active', d.dataset.day === day));
      // update big day title
      panelDayTitle.textContent = day.toUpperCase();

      // clear list
      seriesList.innerHTML = '';
      const list = data[day] || [];
      if (list.length === 0) {
        const empty = document.createElement('div');
        empty.style.color = 'rgba(255,255,255,0.6)';
        empty.style.padding = '18px';
        empty.textContent = 'No series set for ' + day.charAt(0).toUpperCase() + day.slice(1) + '.';
        seriesList.appendChild(empty);
        return;
      }

      list.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'list-item';

        const left = document.createElement('div');
        left.className = 'series-box';
        const title = document.createElement('div');
        title.className = 'series-title';
        title.textContent = s.title;
        left.appendChild(title);

        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.type = 'button';
        btn.textContent = 'copy link';
        btn.dataset.url = s.url;
        btn.addEventListener('click', onCopy);

        item.appendChild(left);
        item.appendChild(btn);
        seriesList.appendChild(item);
      });
    }

    function onCopy(e) {
      const url = e.currentTarget.dataset.url || '';
      if (!url) {
        showToast('No URL');
        return;
      }
      // copy to clipboard
      navigator.clipboard.writeText(url).then(() => {
        showToast('Copied!');
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta);
        ta.select(); try { document.execCommand('copy'); showToast('Copied!'); } catch (err) { showToast('Copy failed'); }
        ta.remove();
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    // wire day tabs
    days.forEach(d => d.addEventListener('click', () => renderDay(d.dataset.day)));

    // initial render
    renderDay('monday');

    // Expose a small helper so you can programatically set series from console if needed
    window.DailyDonghua = { data, renderDay, showToast };
  </script>
</body>

</html>
